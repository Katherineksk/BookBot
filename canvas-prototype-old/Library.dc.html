<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Библиотека</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0}
  a{color:inherit;text-decoration:none}
  button{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Helvetica,Arial,sans-serif;cursor:pointer}
  ::-webkit-scrollbar{display:none}
  .add-sheet{transition:transform .45s cubic-bezier(0.34,1.35,0.64,1), opacity .25s ease;}
  .add-scrim{transition:background-color .3s ease;}
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif; color: #1C1C1E; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <sc-if value="{{showFolders}}" hint-placeholder-val="{{true}}">
    <div style="padding: 22px 20px 6px; flex-shrink: 0;">
      <div style="font-family: ui-serif, 'New York', Charter, Georgia, serif; font-weight: 700; font-size: 34px; letter-spacing: -0.01em;">Библиотека</div>
    </div>
    <div style="flex-grow: 1; overflow-y: auto; padding: 14px 20px 118px;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
        <sc-for list="{{folders}}" as="f" hint-placeholder-count="4">
          <button onClick="{{f.open}}" style="background: #FFFFFF; border: none; border-radius: 18px; padding: 22px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <svg width="46" height="46" viewBox="0 0 24 24">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="{{f.color}}"/>
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2H5a2 2 0 0 0-2 2z" fill="rgba(255,255,255,0.28)"/>
            </svg>
            <div style="font-size: 14.5px; font-weight: 600;">{{f.title}}</div>
            <div style="font-size: 12px; color: #8E8E93;">{{f.count}} книг</div>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{showGrid}}" hint-placeholder-val="{{false}}">
    <div style="padding: 18px 20px 10px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;">
      <button onClick="{{closeFolder}}" aria-label="Назад" style="display: inline-flex; align-items: center; gap: 4px; padding: 7px 14px 7px 10px; border-radius: 999px; background: rgba(255,255,255,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.8); color: {{accent}}; font-size: 15px; font-weight: 500;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        Библиотека
      </button>
      <div style="font-family: ui-serif, 'New York', Charter, Georgia, serif; font-weight: 700; font-size: 21px;">{{activeTitle}}</div>
    </div>
    <div style="flex-grow: 1; overflow-y: auto; padding: 8px 20px 118px;">
      <sc-if value="{{hasBooksInFolder}}" hint-placeholder-val="{{true}}">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 12px;">
          <sc-for list="{{activeBooks}}" as="item" hint-placeholder-count="6">
            <a href="BookDetail.dc.html">
              <div style="position: relative; width: 100%; aspect-ratio: 2 / 3; border-radius: 3px 8px 8px 3px; overflow: hidden; background: linear-gradient(100deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 16%, rgba(255,255,255,0) 82%, rgba(0,0,0,0.3) 100%), {{item.coverBg}}; box-shadow: 3px 10px 18px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.18); display: flex; align-items: center; justify-content: center;">
                <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(to right, rgba(0,0,0,0.45), rgba(0,0,0,0));"></div>
                <div style="position: absolute; right: 0; top: 2%; bottom: 2%; width: 3px; background: repeating-linear-gradient(to bottom, #F7F2E7 0px, #F7F2E7 1.5px, #DED5BE 1.5px, #DED5BE 3px);"></div>
                <div style="font-family: ui-serif, 'New York', Charter, Georgia, serif; font-weight: 700; font-size: 26px; color: rgba(255,255,255,0.92);">{{item.initial}}</div>
                <sc-if value="{{item.showProgress}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; left: 6px; right: 3px; bottom: 0; height: 4px; background: rgba(0,0,0,0.25);">
                    <div style="height: 100%; background: #FF9500; width: {{item.progress}}%;"></div>
                  </div>
                </sc-if>
              </div>
              <div style="margin-top: 8px; font-size: 12.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{item.title}}</div>
              <div style="font-size: 11px; color: #8E8E93; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{item.metaLine}}</div>
            </a>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{noBooksInFolder}}" hint-placeholder-val="{{false}}">
        <div style="padding: 60px 12px; text-align: center; color: #8E8E93; font-size: 14px;">В этой папке пока пусто</div>
      </sc-if>
    </div>
  </sc-if>

  <div class="add-scrim" style="position: absolute; inset: 0; background: rgba(0,0,0,{{scrimAlpha}}); pointer-events: {{overlayPointer}}; z-index: 40;" onClick="{{closeSheet}}"></div>

  <div class="add-sheet" style="position: absolute; left: 16px; right: 16px; bottom: 96px; transform-origin: 90% 100%; transform: {{sheetTransform}}; opacity: {{sheetOpacity}}; pointer-events: {{overlayPointer}}; background: rgba(255,255,255,0.8); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 0.5px solid rgba(255,255,255,0.6); border-radius: 28px; padding: 16px; box-shadow: 0 24px 54px rgba(0,0,0,0.35); z-index: 41; display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 4px;">
      <div style="font-family: ui-serif, 'New York', Charter, Georgia, serif; font-weight: 700; font-size: 19px;">Добавить книгу</div>
      <button onClick="{{closeSheet}}" aria-label="Закрыть" style="width: 28px; height: 28px; border-radius: 999px; border: none; background: rgba(118,118,128,0.18); display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <a href="AddLink.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #007AFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg></div>
      <div><div style="font-size: 15px; font-weight: 600;">Вставить ссылку</div><div style="font-size: 12px; color: #8E8E93;">Ozon, Читай-город</div></div>
    </a>
    <a href="AddScan.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #FF9500; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M4 16v2a2 2 0 0 0 2 2h2"/><path d="M20 8V6a2 2 0 0 0-2-2h-2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><circle cx="12" cy="12" r="3.5"/></svg></div>
      <div><div style="font-size: 15px; font-weight: 600;">Сканировать обложку</div><div style="font-size: 12px; color: #8E8E93;">Или штрихкод</div></div>
    </a>
    <a href="AddSearch.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #5E7A73; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></div>
      <div><div style="font-size: 15px; font-weight: 600;">Найти по названию</div><div style="font-size: 12px; color: #8E8E93;">Поиск по базе книг</div></div>
    </a>
    <a href="AddManual.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px;">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #7A5B63; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></div>
      <div><div style="font-size: 15px; font-weight: 600;">Добавить вручную</div><div style="font-size: 12px; color: #8E8E93;">Если книги нет в базе</div></div>
    </a>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; height: 64px; display: flex; align-items: center; gap: 10px; z-index: 30;">
    <div style="flex-grow: 1; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.68); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 0.5px solid rgba(255,255,255,0.75); box-shadow: 0 10px 26px rgba(0,0,0,0.16); display: flex; align-items: center; justify-content: space-around; padding: 0 6px;">
      <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 16px; border-radius: 18px; font-size: 10px; font-weight: 600; color: #8E8E93;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Главная
      </a>
      <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 16px; border-radius: 18px; font-size: 10px; font-weight: 600; color: #8E8E93;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
        Статистика
      </a>
      <a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 16px; border-radius: 18px; background: rgba(0,122,255,0.14); font-size: 10px; font-weight: 600; color: {{accent}};">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h4l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/></svg>
        Библиотека
      </a>
    </div>
    <button onClick="{{openSheet}}" aria-label="Добавить книгу" style="flex-shrink: 0; width: 64px; height: 64px; border-radius: 32px; background: rgba(255,255,255,0.68); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 0.5px solid rgba(255,255,255,0.75); box-shadow: 0 10px 26px rgba(0,0,0,0.16); display: flex; align-items: center; justify-content: center;">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,122,255,0.42), inset 0 1px 0 rgba(255,255,255,0.4);">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#007AFF","options":["#007AFF","#FF9500","#34C759","#AF52DE"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { addOpen: false, openFolder: null };
  }
  toggleSheet(v) {
    return () => this.setState({ addOpen: v });
  }
  openFolder(key) {
    return () => this.setState({ openFolder: key });
  }
  closeFolder() {
    return () => this.setState({ openFolder: null });
  }
  renderVals() {
    const accent = this.props.accent ?? '#007AFF';
    const palette = ['#5B6472', '#7C6A58', '#5E7A73', '#7A5B63', '#4E6A8C'];
    const raw = [
      { id: 1, title: 'Мастер и Маргарита', author: 'Михаил Булгаков', status: 'reading', progress: 62 },
      { id: 2, title: 'Норвежский лес', author: 'Харуки Мураками', status: 'reading', progress: 30 },
      { id: 3, title: 'Sapiens', author: 'Юваль Ной Харари', status: 'want' },
      { id: 4, title: 'Сто лет одиночества', author: 'Габриэль Гарсиа Маркес', status: 'want' },
      { id: 5, title: 'Educated', author: 'Тара Уэстовер', status: 'want' },
      { id: 6, title: 'Кладбище домашних животных', author: 'Стивен Кинг', status: 'finished', rating: 4 },
      { id: 7, title: 'Тонкое искусство пофигизма', author: 'Марк Мэнсон', status: 'finished', rating: 3 },
      { id: 8, title: 'Атлант расправил плечи', author: 'Айн Рэнд', status: 'finished', rating: 5 },
      { id: 9, title: 'Улисс', author: 'Джеймс Джойс', status: 'not_finished', pageStopped: 120 },
      { id: 10, title: 'Война и мир', author: 'Лев Толстой', status: 'not_finished', pageStopped: 340 }
    ];
    const mapBook = (b, i) => {
      let metaLine = b.author;
      if (b.status === 'reading') metaLine = `${b.progress}% прочитано`;
      if (b.status === 'not_finished') metaLine = `Остановился на ${b.pageStopped} стр.`;
      return {
        ...b,
        initial: b.title.charAt(0).toUpperCase(),
        coverBg: palette[i % palette.length],
        showProgress: b.status === 'reading',
        metaLine
      };
    };
    const byStatus = (s) => raw.filter((b) => b.status === s).map(mapBook);
    const defs = [
      { key: 'want', title: 'Хочу прочитать', color: '#6B7A8F' },
      { key: 'reading', title: 'Читаю', color: accent },
      { key: 'finished', title: 'Прочитано', color: '#34C759' },
      { key: 'not_finished', title: 'Не дочитано', color: '#FF3B30' }
    ];
    const folders = defs.map((d) => ({
      ...d,
      count: byStatus(d.key).length,
      open: this.openFolder(d.key)
    }));
    const openKey = this.state.openFolder;
    const activeDef = defs.find((d) => d.key === openKey);
    const activeBooks = openKey ? byStatus(openKey) : [];
    const open = this.state.addOpen;
    return {
      accent,
      folders,
      showFolders: !openKey,
      showGrid: !!openKey,
      activeTitle: activeDef ? activeDef.title : '',
      activeBooks,
      hasBooksInFolder: activeBooks.length > 0,
      noBooksInFolder: activeBooks.length === 0,
      closeFolder: this.closeFolder(),
      openSheet: this.toggleSheet(true),
      closeSheet: this.toggleSheet(false),
      scrimAlpha: open ? 0.38 : 0,
      sheetTransform: open ? 'scale(1) translateY(0)' : 'scale(0.1) translateY(50%)',
      sheetOpacity: open ? 1 : 0,
      overlayPointer: open ? 'auto' : 'none'
    };
  }
}
</script>
</body>
</html>
