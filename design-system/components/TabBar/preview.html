<!-- @dsCard group="Навигация" height=150 -->
<style>
  *{box-sizing:border-box}
  body{margin:0}
  .stage{background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:24px 16px}
  .cover{position:relative;width:var(--size-cover-shelf-w);height:var(--size-cover-shelf-h);flex:none;color:var(--on-ink);
    border-radius:var(--radius-book) var(--radius-book-edge) var(--radius-book-edge) var(--radius-book);box-shadow:var(--shadow-book)}
  .cover::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,rgba(255,255,255,.14),rgba(255,255,255,0) 30%,rgba(0,0,0,0) 80%,rgba(0,0,0,.06))}
  .cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;min-width:6px;border-radius:inherit;pointer-events:none;
    background:linear-gradient(to right,rgba(255,255,255,.22) 0,rgba(255,255,255,.22) 1px,rgba(0,0,0,.32) 1px,rgba(0,0,0,.32) 2px,rgba(0,0,0,0) 2px,rgba(0,0,0,0) 4px,rgba(0,0,0,.2) 4px,rgba(0,0,0,.2) 5px,rgba(255,255,255,.24) 5px,rgba(255,255,255,.24) 6px,rgba(0,0,0,0) 6px)}
  .cover .t{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font:700 13px/1.2 var(--font-serif)}
  .c1{background:var(--cover-1)}.c2{background:var(--cover-2)}.c3{background:var(--cover-3)}.c4{background:var(--cover-4)}.c5{background:var(--cover-5)}.c6{background:var(--cover-6)}
  .pill{display:inline-flex;align-items:center;justify-content:center;width:var(--size-pill-w);height:var(--size-pill-h);border:0;border-radius:var(--radius-pill);background:var(--ink);color:var(--on-ink);font:590 13px/16px var(--font-sans)}
</style>
<div class="stage"><div style="background:linear-gradient(var(--bg),#e9e6df);padding:var(--space-5);border-radius:var(--radius-sheet)">
<div style="display:flex;align-items:center;gap:var(--space-2);height:var(--size-tabbar);max-width:353px">
  <div style="flex:1;height:100%;border-radius:var(--radius-tab);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow-glass);display:flex;align-items:center;justify-content:space-around;padding:0 6px">
    <div style="flex:1;height:48px;border-radius:24px;background:#00000014;display:flex;align-items:center;justify-content:center;color:var(--accent-active)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg></div>
    <div style="flex:1;height:48px;display:flex;align-items:center;justify-content:center;color:var(--ink-secondary)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="4" height="15" rx="1"/><rect x="9" y="3" width="4" height="17" rx="1"/><path d="M15.5 6.5 19 5.5l3 12-3.5 1z"/></svg></div>
  </div>
  <div style="width:64px;height:64px;border-radius:var(--radius-tab);background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow-glass);display:flex;align-items:center;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
</div></div></div>
